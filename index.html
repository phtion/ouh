<div id="tl"><div id="tlb"><button id="tSel" class="on">↖ Select (V)</button><button id="tRaz">✂ Razor (X)</button><button id="tSnap" class="on">🧲 Snap</button><span class="sep"></span><button id="tAuto" title="Auto-keyframe: any value you change at the playhead becomes a keyframe">⏺ Auto-key</button><button id="kPrev" title="Previous keyframe ([)">◆◀</button><button id="kNext" title="Next keyframe (])">▶◆</button><span style="margin-left:auto" class="mu">Zoom</span><input id="zm" type="range" min="15" max="200" value="60" aria-label="Timeline zoom"></div><div id="tls"><div id="lab"></div><div id="tc"></div></div></div>
